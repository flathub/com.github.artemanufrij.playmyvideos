id: com.github.artemanufrij.playmyvideos
runtime: org.freedesktop.Platform
runtime-version: '24.08'
base: io.elementary.BaseApp
base-version: 'circe-24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.vala
build-options:
  prepend-path: /usr/lib/sdk/vala/bin/
  prepend-ld-library-path: /usr/lib/sdk/vala/lib
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --env=GST_PLUGIN_PATH_1_0=/app/lib/gstreamer-1.0
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.mpris.MediaPlayer2
  - --talk-name=org.freedesktop.thumbnails.Thumbnailer1
  - --filesystem=xdg-videos
  - --filesystem=/media
  - --filesystem=/run/media
  - --metadata=X-DConf=migrate-path=/com/github/artemanufrij/playmyvideos/
command: com.github.artemanufrij.playmyvideos
cleanup:
  - "*.a"
  - "*.la"
cleanup-commands:
  - mkdir -p /app/lib/ffmpeg
  - rm -rv /app/include
  - rm -rv /app/lib/pkgconfig
  - rm -rv /app/share/gir-1.0
  - rm -rv /app/share/vala*
modules:
  - "shared-modules/clutter/clutter.json"
  - "shared-modules/libsoup/libsoup-2.4.json"
  - name: libgee
    build-options:
    make-install-args:
      - girdir=/app/share/gir-1.0
      - typelibdir=/app/lib/girepository-1.0
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libgee/0.20/libgee-0.20.8.tar.xz
        sha256: 189815ac143d89867193b0c52b7dc31f3aa108a15f04d6b5dca2b6adfad0b0ee

  - name: playmyvideos
    buildsystem: meson
    post-install:
      - mkdir -p /app/share/icons/hicolor/scalable/apps && mv /app/share/icons/hicolor/64x64/apps/${FLATPAK_ID}.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - find /app/share/icons/hicolor -type f -not -path "*scalable*" -not -path "*actions*" -name "*.svg" -delete
    sources:
      - type: archive
        url: "https://github.com/artemanufrij/playmyvideos/archive/1.1.2.tar.gz"
        sha256: 3693045cf3d4071400edcec1c6b827e185bf54a3cd135188cbbb756fca7ecb5a
      - type: patch
        path: fix-appdata.patch
      - type: patch
        path: elementary-theme.patch

